<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · Airport</title>
  <style>
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;color:#f2f3e9;background:#171b17;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:flex;flex-direction:column}
    header,footer{margin:0 clamp(22px,5vw,80px);padding:24px 0}
    header{border-bottom:1px solid #393e37}
    .brand{display:inline-flex;align-items:center;gap:10px;font-size:24px;letter-spacing:-1.4px;font-weight:680;color:inherit;text-decoration:none}
    main{flex:1;display:grid;place-items:center;padding:48px 24px 72px}
    section{width:min(100%,390px)}
    h1{font-size:clamp(36px,6vw,50px);letter-spacing:-.055em;line-height:1.07;font-weight:570;margin:0}
    p{color:#bcc1b8;margin:16px 0 30px;overflow-wrap:anywhere}
    label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
    input,button{font:inherit}
    input{width:100%;padding:12px 14px;min-height:48px;background:#20251f;border:1px solid #687060;border-radius:7px;color:inherit}
    input[name=code]{letter-spacing:.17em;font:22px ui-monospace,monospace}
    button{cursor:pointer}
    button:disabled{cursor:wait;opacity:.65}
    :focus-visible{outline:2px solid #d9fc64;outline-offset:4px}
    .primary{width:100%;margin-top:18px;border:0;border-radius:7px;background:#deff67;color:#182018;padding:13px 16px;font-weight:650;display:flex;justify-content:space-between}
    .primary:hover{background:#e8ff94}
    .secondary{color:#dce6cc;text-decoration:underline;text-underline-offset:4px;background:none;border:0;padding:6px 0;font-size:14px}
    .alternate{display:flex;gap:20px;justify-content:space-between;margin-top:12px}
    #status{font-size:14px;min-height:1.5em;margin:14px 0 0;color:#ffc7b1}
    footer{border-top:1px solid #393e37;color:#a5afa1;font-size:13px}
  </style>
</head>
<body>
  <header><a class="brand" href="https://airport.so" aria-label="Airport home">
    <svg aria-hidden="true" width="32" height="32" viewBox="0 0 48 48"><rect width="48" height="48" rx="9" fill="#deff67"/><path fill="#18201c" d="m7 32 18-18h7L14 32zM17 32l18-18h6L23 32zM28 32l10-10v10z"/></svg>Airport
  </a></header>
  <main><section>
    <h1 id="heading">Sign in to Airport</h1>
    <p id="intro">Enter your email to sign in or create an account. We’ll send you a one-time code.</p>
    <form id="email-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
      <button class="primary" type="submit">Send code <span aria-hidden="true">→</span></button>
    </form>
    <form id="code-form" hidden>
      <label for="code">Eight-digit code</label>
      <input id="code" name="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required>
      <button class="primary" type="submit">Continue <span aria-hidden="true">→</span></button>
      <div class="alternate">
        <button class="secondary" type="button" id="different">Use another email</button>
        <button class="secondary" type="button" id="resend">Send a new code</button>
      </div>
    </form>
    <div role="status" aria-live="polite" id="status"></div>
    <noscript>Enable JavaScript to sign in to Airport.</noscript>
  </section></main>
  <footer>Airport · Workspace access</footer>
  <script>
    const byId = id => document.getElementById(id);
    const emailForm = byId('email-form'), codeForm = byId('code-form');
    const status = byId('status'), email = byId('email'), code = byId('code');
    const savedKey = 'airport.email.challenge';
    let pending, busy = false;
    function remember(value) {
      pending = value;
      try {
        if (value) sessionStorage.setItem(savedKey,JSON.stringify(value));
        else sessionStorage.removeItem(savedKey);
      } catch { /* The current page still holds the challenge. */ }
    }
    function showStep(focus = true) {
      emailForm.hidden = Boolean(pending);
      codeForm.hidden = !pending;
      byId('heading').textContent = pending ? 'Check your email' : 'Sign in to Airport';
      byId('intro').textContent = pending ? 'Enter the code we sent to '+pending.email+'. It expires in 10 minutes.' :
        'Enter your email to sign in or create an account. We’ll send you a one-time code.';
      if (focus) (pending ? code : email).focus();
    }
    async function post(path,data) {
      const response = await fetch('/api/auth/'+path,{method:'POST',credentials:'same-origin',redirect:'error',
        headers:{'Content-Type':'application/json','X-Airport-Console':'1'},body:JSON.stringify(data)});
      const result = await response.json();
      if (!response.ok) throw Error(result.error || 'Airport could not complete that request.');
      return result;
    }
    async function submit(action) {
      if (busy) return;
      busy = true; status.textContent = '';
      document.querySelectorAll('button').forEach(button=>button.disabled=true);
      try { await action(); }
      catch (err) { status.textContent = err instanceof TypeError ? 'Could not reach Airport. Check your connection and try again.' : err.message; }
      finally { busy=false; document.querySelectorAll('button').forEach(button=>button.disabled=false); }
    }
    async function send(address) {
      const {challengeId} = await post('start',{email:address});
      remember({email:address,challengeId,expires:Date.now()+600000});
      code.value=''; showStep();
    }
    emailForm.addEventListener('submit',event=>{event.preventDefault();submit(()=>send(email.value.trim()));});
    codeForm.addEventListener('submit',event=>{
      event.preventDefault();
      submit(async()=>{
        await post('verify',{challengeId:pending.challengeId,code:code.value});
        remember(null); location.replace('/'+location.hash);
      });
    });
    byId('different').addEventListener('click',()=>{
      email.value=pending.email; remember(null); code.value=''; status.textContent=''; showStep();
    });
    byId('resend').addEventListener('click',()=>submit(async()=>{await send(pending.email);status.textContent='New code sent.';}));
    try {
      const saved = JSON.parse(sessionStorage.getItem(savedKey));
      if (saved?.expires>Date.now() && typeof saved.email==='string' && /^[A-Za-z0-9_-]{43}$/.test(saved.challengeId)) pending=saved;
    } catch { /* A fresh sign-in is available. */ }
    showStep(false);
  </script>
</body>
</html>
