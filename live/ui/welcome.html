<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141615">
  <meta name="referrer" content="no-referrer">
  <title>Welcome to Airport</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f4ed;background:#141615;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:flex;flex-direction:column}
    header,main,footer{width:min(1060px,calc(100% - 64px));margin-inline:auto}
    header{padding:30px 0;border-bottom:1px solid #353935}
    .brand{display:inline-flex;align-items:center;gap:10px;font-size:24px;letter-spacing:-1.4px;font-weight:700}
    .brand svg{width:32px;height:32px}
    main{flex:1;display:grid;align-content:center;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);align-items:center;gap:clamp(32px,7vw,95px);padding-block:64px}
    h1{margin:0;max-width:13ch;font-size:clamp(44px,6.3vw,78px);line-height:.99;font-weight:580;letter-spacing:-.065em;text-wrap:balance}
    .intro{max-width:400px;margin:23px 0 30px;color:#b6bcb4;font-size:18px;line-height:1.5}
    .continue{display:inline-flex;align-items:center;justify-content:space-between;gap:28px;background:#deff67;color:#192017;text-decoration:none;border-radius:6px;font-weight:650;padding:14px 18px;min-height:48px}
    .continue:hover{background:#e9ff99}.continue:focus-visible{outline:2px solid #f3f4ed;outline-offset:4px}
    .hint{max-width:38ch;color:#a4aaa3;margin:14px 0 0;font-size:14px;line-height:1.5}
    figure{margin:0;border:1px solid #3b403a;border-radius:10px;background:#1b1e1b;overflow:hidden}
    figcaption{border-bottom:1px solid #393e36;padding:15px 18px;display:flex;align-items:center;gap:8px;font-size:14px}
    .diagram{background-image:radial-gradient(#43483d 0.6px,transparent 0.8px);background-size:11px 11px;display:block;width:100%;height:auto}
    .node{fill:#252a24;stroke:#4c5448}.label{fill:#eef0e8;font:500 15px -apple-system,BlinkMacSystemFont,sans-serif}
    footer{padding:18px 0 24px;border-top:1px solid #353935;color:#a4aaa3;font-size:13px}
    @media(max-width:720px){header,main,footer{width:min(520px,calc(100% - 40px))}header{padding:20px 0}main{grid-template-columns:1fr;gap:36px;padding-block:40px}figure{max-width:430px}.intro{font-size:16px;margin:18px 0 22px}h1{font-size:clamp(40px,10vw,60px)}}
  </style>
</head>
<body>
<header><span class="brand"><svg aria-hidden="true" viewBox="0 0 48 48"><rect width="48" height="48" rx="9" fill="#deff67"/><path fill="#18201c" d="m7 32 18-18h7L14 32zM17 32l18-18h6L23 32zM28 32l10-10v10z"/></svg>Airport</span></header>
<main>
  <section aria-labelledby="title">
    <h1 id="title">Your Airport workspace</h1>
    <p class="intro" id="intro">Connect your apps, choose what each agent can do, and see every request in one place.</p>
    <a class="continue" href="/login" id="continue">Continue with email <span aria-hidden="true">→</span></a>
    <p class="hint" id="hint">Verify your email to sign in or create an account.</p>
  </section>
  <figure>
    <figcaption>How a request reaches your apps</figcaption>
    <svg class="diagram" viewBox="0 0 410 235" role="img" aria-label="An agent sends a request to Airport. Workspace permissions control its access to email and calendar.">
      <g fill="none" stroke="#a4bd60" stroke-width="1.5"><path d="M92 118h72m78 0c40 0 20-52 61-52m-61 52c40 0 20 52 61 52"/></g>
      <g fill="#d6f778"><circle cx="129" cy="118" r="3"/><circle cx="271" cy="96" r="3"/><circle cx="271" cy="140" r="3"/></g>
      <rect class="node" x="15" y="101" width="82" height="34" rx="6"/><text class="label" x="56" y="123" text-anchor="middle">Agent</text>
      <rect x="163" y="81" width="82" height="74" rx="10" fill="#23281f" stroke="#718447"/>
      <svg x="189" y="92" width="30" height="30" viewBox="0 0 48 48"><rect width="48" height="48" rx="8" fill="#deff67"/><path fill="#18201c" d="m7 32 18-18h7L14 32zM17 32l18-18h6L23 32zM28 32l10-10v10z"/></svg>
      <text class="label" x="204" y="143" text-anchor="middle">Airport</text>
      <rect class="node" x="301" y="49" width="94" height="34" rx="6"/><text class="label" x="348" y="71" text-anchor="middle">Email</text>
      <rect class="node" x="301" y="153" width="94" height="34" rx="6"/><text class="label" x="348" y="175" text-anchor="middle">Calendar</text>
    </svg>
  </figure>
</main>
<footer>Airport · Workspace access</footer>
<script>
  const invite = new URLSearchParams(location.hash.slice(1)).get('invite');
  if (invite) {
    const hint = document.getElementById('hint');
    if (/^[a-zA-Z0-9_-]{22,180}$/.test(invite)) {
      try {
        sessionStorage.setItem('airport.account.invite', invite);
        history.replaceState(null, '', '/welcome');
        document.getElementById('title').textContent = 'Join Airport';
        hint.textContent = 'Continue with the email address on your invitation.';
      } catch {
        hint.textContent = 'Allow session storage for this site, then reopen your invitation.';
      }
    } else {
      hint.textContent = 'This invitation link is incomplete. You can still continue with your email.';
    }
  }
</script>
</body>
</html>
