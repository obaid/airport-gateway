<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f4e9">
  <meta name="referrer" content="no-referrer">
  <title>Welcome to Airport</title>
  <style>/* airport-access-style */</style>
</head>
<body class="access-shell">
  <header class="access-header">
    <a class="access-brand" href="https://airport.so/" aria-label="Airport home"><svg aria-hidden="true" width="37" height="37" viewBox="0 0 48 48"><rect width="48" height="48" rx="9" fill="#deff67"/><path fill="#18201c" d="m7 32 18-18h7L14 32zM17 32l18-18h6L23 32zM28 32l10-10v10z"/></svg>Airport</a>
    <a class="access-home" href="https://airport.so/#agents">How Airport works <span aria-hidden="true">↗</span></a>
  </header>
  <main class="access-world">
    <section class="access-pass" aria-labelledby="title">
      <h1 id="title">Your Airport workspace</h1>
      <p class="access-intro" id="intro">Connect your apps, choose what each agent can do, and see every request in one place.</p>
      <div class="access-continue">
        <a class="access-primary" href="/login" id="continue">Continue with email <span aria-hidden="true">→</span></a>
        <p class="access-hint" id="hint">Verify your email to sign in or create an account.</p>
      </div>
    </section>
    <img class="access-radar" src="/assets/access-airfield.svg" width="620" height="620" alt="Example route from an agent through Airport to email and calendar.">
  </main>
  <script>
  const invite = new URLSearchParams(location.hash.slice(1)).get('invite');
  if (invite) {
    const hint = document.getElementById('hint');
    if (/^[a-zA-Z0-9_-]{22,180}$/.test(invite)) {
      try {
        sessionStorage.setItem('airport.account.invite', invite);
        history.replaceState(null, '', '/welcome');
        document.getElementById('title').textContent = 'Join Airport';
        hint.textContent = 'Continue with the email address on your invitation.';
      } catch {
        hint.textContent = 'Allow session storage for this site, then reopen your invitation.';
      }
    } else {
      hint.textContent = 'This invitation link is incomplete. You can still continue with your email.';
    }
  }
</script>
</body>
</html>
